[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OMOP-FHIR-Bridge"
version = "0.1.0"
description = "Bidirectional FHIR R4 <-> OMOP CDM v5.4 bridge with DDL-derived conformance checks and a round-trip fidelity report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anay Sinhal" }]
keywords = ["FHIR", "OMOP", "CDM", "HL7", "interoperability", "ETL", "OHDSI"]
dependencies = [
    "duckdb>=1.0",
    "click>=8.1",
    "fhir.resources>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ofb = "omop_fhir_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omop_fhir_bridge = ["vocab_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
